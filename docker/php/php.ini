; Configuración PHP de la aplicación (se carga después de los valores por defecto)

date.timezone = America/Bogota
memory_limit = 256M

; Documentos de mantenimientos: hasta 10 MB por archivo, varios por envío
upload_max_filesize = 20M
post_max_size = 60M
max_file_uploads = 20

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Revalida archivos modificados (necesario en desarrollo con el código montado)
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
