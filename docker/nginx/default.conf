server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Documentos de mantenimientos: 10 MB por archivo, varios por envío
    client_max_body_size 60M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Archivos subidos (storage/app/public). Se sirven directo, sin depender del enlace
    # public/storage, que en Laragon apunta a una ruta de Windows.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # El código PHP vive en el contenedor "app" con la misma ruta
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
